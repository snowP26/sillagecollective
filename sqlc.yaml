version: "2"

sql:
  - engine: "postgresql"
    schema: "./server/db/migration"
    queries: "./server/db/query"

    database:
      uri: "postgresql://postgresql:strong_admin@db:5433/sillage_collective?sslmode=disable"

    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"

        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false   